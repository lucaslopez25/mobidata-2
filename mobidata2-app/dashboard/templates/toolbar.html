<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">{{ titulo_da_pagina }}</h1>

    <div class="btn-toolbar mb-2 mb-md-0">
        {% if exportar_sql_csv_ativado %}
            <div class="btn-group me-2"> 
                <button type="button" class="btn btn-sm btn-outline-secondary">
                    Exportar SQL
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="TODO">
                    Exportar CSV
                </button> 
            </div>
        {% endif %}
        {% if selecionar_ano_ativado %}
            <form method="get" class="d-flex align-items-center">
                <label for="ano" class="me-2">Ano:</label>
                <select name="ano" id="ano" class="form-select form-select-sm btn btn-outline-secondary" onchange="this.form.submit()" style="width: fit-content;">
                    {% for ano in anos %}
                    <option value="{{ ano }}" {% if ano == ano_selecionado %}selected{% endif %}>{{ ano }}</option>
                    {% endfor %}
                </select>
            </form>
        {% endif %}
    </div>
</div>
